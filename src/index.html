<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Время в разных часовых поясах</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🌍 Текущее время в разных городах</h1>
  <div id="time-container">
    <div class="time-card" data-tz="Europe/Moscow">🕒 Москва: <span></span></div>
    <div class="time-card" data-tz="America/New_York">🕒 Нью-Йорк: <span></span></div>
    <div class="time-card" data-tz="Asia/Tokyo">🕒 Токио: <span></span></div>
    <div class="time-card" data-tz="Australia/Sydney">🕒 Сидней: <span></span></div>
    <div class="time-card" data-tz="Asia/Tomsk">🕒 Томск: <span></span></div>
    <div class="time-card" data-tz="Asia/Tomsk">🕒 Томск: <span></span></div>
  </div>  

  <script src="script.js"></script>
</body>
</html>
